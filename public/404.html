<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Page not found — Aimee Redmond, front-end developer." />
    <meta name="theme-color" content="#f7f7ff" />
    <title>Page not found | Aimee Redmond</title>
    <script>
      // Match the theme the visitor already had on the rest of the site, set
      // before paint so there's no flash of the wrong theme. Same logic as App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');

      :root { --ink:#17172a; --muted:#636379; --surface:#f8f8fc; --card:#fff; --line:rgba(23,23,42,.15); --accent:#665cf6; --focus:#f47738; color-scheme:light; }
      :root[data-theme='dark'] { --ink:#f5f4ff; --muted:#b7b6c8; --surface:#12121c; --card:#1d1c2a; --line:rgba(245,244,255,.16); --accent:#9b94ff; --focus:#ffc15e; color-scheme:dark; }

      * { box-sizing:border-box; }
      html, body { height:100%; }
      body {
        margin:0;
        display:flex;
        align-items:center;
        justify-content:center;
        background:var(--surface);
        color:var(--ink);
        font-family:Manrope, Arial, sans-serif;
        line-height:1.55;
        text-align:center;
        padding:2rem;
      }
      a { color:inherit; }
      .wrap { max-width:32rem; }
      .eyebrow {
        display:inline-block;
        margin-bottom:1.5rem;
        color:var(--muted);
        font:500 .68rem/1.2 'DM Mono', monospace;
        letter-spacing:.08em;
        text-transform:uppercase;
      }
      h1 {
        margin:0 0 1rem;
        font-size:clamp(2.35rem, 6vw, 3.6rem);
        font-weight:700;
        letter-spacing:-.04em;
        line-height:1.05;
      }
      h1 em {
        font-family:'Playfair Display', serif;
        font-weight:500;
        font-style:italic;
      }
      p {
        margin:0 auto 2.2rem;
        max-width:26rem;
        color:var(--muted);
        font-size:1rem;
      }
      .actions {
        display:flex;
        gap:1.2rem;
        align-items:center;
        justify-content:center;
        flex-wrap:wrap;
      }
      .button {
        display:inline-flex;
        align-items:center;
        gap:.6rem;
        border:1px solid var(--ink);
        padding:.9rem 1.3rem;
        font-size:.83rem;
        font-weight:700;
        text-decoration:none;
        background:var(--ink);
        color:var(--surface);
        transition:transform .2s;
      }
      .button:hover { transform:translate(-3px, -3px); }
      .text-link {
        font-size:.87rem;
        font-weight:700;
        text-decoration:none;
        border-bottom:1px solid var(--ink);
        padding-bottom:.2rem;
      }
      a:focus-visible, .button:focus-visible {
        outline:3px solid var(--focus);
        outline-offset:3px;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition:none !important; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">404 · Page not found</p>
      <h1>Looks like this page<br /><em>wandered off.</em></h1>
      <p>The link might be broken, or the page may have moved. Let's get you back to somewhere real.</p>
      <div class="actions">
        <a class="button" href="/">Back to home</a>
        <a class="text-link" href="/#work">View my work</a>
      </div>
    </div>
  </body>
</html>
